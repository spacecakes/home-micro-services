# Dashboard served via the traefik router (api@internal), not the insecure :8080 listener
api:
  dashboard: true
  insecure: false

metrics:
  prometheus:
    addRoutersLabels: true

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    http:
      middlewares:
        - 'default-headers@file'
      tls:
        certResolver: letsencrypt
        domains:
          - main: 'lundmark.tech'
            sans:
              - '*.lundmark.tech'

providers:
  docker:
    endpoint: 'tcp://dockerproxy:2375' # read-only proxy, not the raw socket
    exposedByDefault: false # containers must opt in with traefik.enable=true
    defaultRule: 'Host(`{{ coalesce (index .Labels "com.docker.compose.service") (normalize .Name) }}.lundmark.tech`)'
  file:
    filename: /traefik-config/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: g.lundmark@gmail.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - '1.1.1.1:53'
          - '1.0.0.1:53'
